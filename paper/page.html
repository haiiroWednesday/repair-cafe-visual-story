<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Repair Café, on paper</title>
<style>
{{FONTS}}
{{FRAMES}}
:root{--navy:#23337E;--ink:#1E2A62;--text:#2A3360;--soft:#5E6585;--rust:#C24A23;--gold:#B08D57;--cream:#EFEADB;--title:'Androgy','Newsreader',Georgia,serif;--hand:'Brush','Newsreader',sans-serif;--body:'Newsreader',Georgia,serif;--tear:110px;color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:#DCD5C4;color:var(--text);font:400 18px/1.62 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.ph{background:rgba(194,74,35,.07);outline:1px dashed rgba(194,74,35,.4);border-radius:2px;padding:0 2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--rust);outline-offset:3px}

/* top bar: a strip of paper with the sections */
.bar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:22px;padding:10px max(18px,3vw);background:rgba(240,235,222,.93);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid rgba(35,51,126,.16)}
.bar .name{font:400 30px/1 var(--title);color:var(--navy);text-decoration:none;white-space:nowrap}
.bar nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-left:auto}
.bar nav::-webkit-scrollbar{display:none}
.bar nav a{font:600 12px var(--body);letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:var(--soft);padding:7px 10px;border-radius:2px;white-space:nowrap}
.bar nav a:hover,.bar nav a[aria-current=true]{color:var(--navy);background:rgba(35,51,126,.07)}
#prog{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--rust)}

/* spreads: sheets of paper laid one over the next, each torn along its top */
.sw{--th:200px;position:relative;margin-top:calc(var(--th) * -.6);filter:drop-shadow(0 -4px 7px rgba(38,30,18,.18))}
.sw.diag{--th:340px}
.sw.first{margin-top:0}
.spread{position:relative;z-index:1;background:var(--cream) center/cover no-repeat;padding:calc(var(--th) + 24px) 0 150px}
.sw.first .spread{padding-top:140px}
.sw:not(.first) .spread{-webkit-mask:var(--tm) top center/100% var(--th) no-repeat,linear-gradient(#000,#000) 0 calc(var(--th) - 1px)/100% calc(100% - var(--th) + 1px) no-repeat;mask:var(--tm) top center/100% var(--th) no-repeat,linear-gradient(#000,#000) 0 calc(var(--th) - 1px)/100% calc(100% - var(--th) + 1px) no-repeat}
.rim{position:absolute;left:0;right:0;top:0;height:var(--th);background:var(--tr) top center/100% var(--th) no-repeat;pointer-events:none;z-index:6}
.first .rim{display:none}
/* under each torn edge: a scrap of tinted tissue, a strip of lace, sometimes a doily tucked in */
.seam{position:absolute;left:0;right:0;top:0;height:var(--th);z-index:0;pointer-events:none}
.seam .tissue{position:absolute;left:0;right:0;top:calc(var(--th) * -.18);height:var(--th);background:var(--tc);opacity:.9;-webkit-mask:var(--tm2) top center/100% 100% no-repeat;mask:var(--tm2) top center/100% 100% no-repeat}
.seam .tissue::after{content:'';position:absolute;inset:0;background:url(img/tx_paper_cream.jpg) center/cover;mix-blend-mode:multiply;opacity:.55}
.seam .lace{position:absolute;left:-1%;right:-1%;top:calc(var(--th) * var(--ly,.24));height:var(--lh,84px);background:var(--lace) 0 0/auto 100% repeat-x;transform:rotate(var(--lr,-.5deg));filter:drop-shadow(0 2px 2px rgba(50,40,20,.3))}
.seam .orn,.sw .over{position:absolute;left:var(--l);top:var(--t);width:var(--w);transform:rotate(var(--r,0deg));filter:drop-shadow(0 3px 4px rgba(50,40,20,.26))}
.sw .over{z-index:7;pointer-events:none}
.sw .end{padding:calc(var(--th) + 20px) max(22px,3vw) 80px;margin:0}
.cream{background-image:url(img/tx_paper_cream.jpg)}
.lined{background-image:url(img/tx_paper_lined.jpg)}
.grid{background-image:url(img/tx_paper_grid.jpg)}
.grey{background-image:url(img/tx_paper_grey.jpg)}
.navy{background-image:url(img/tx_paper_navy.jpg);color:#E9E4D6}

.in{max-width:1260px;margin:0 auto;padding:0 max(22px,3vw);display:grid;grid-template-columns:5fr 7fr;gap:clamp(28px,5vw,72px);align-items:center}
.spread.left .in{grid-template-columns:7fr 5fr}
.cover .in{grid-template-columns:4fr 8fr}
.cover h1{font-size:clamp(54px,6.4vw,96px)}

/* type: big two-line titles, small body under thin rules */
h1,h2{font-variant-ligatures:none;font-feature-settings:'liga' 0;font-family:var(--title);font-weight:400;color:var(--navy);margin:22px 0 22px;text-wrap:balance}
h1{font-size:clamp(58px,7.4vw,112px);line-height:1}
h2{font-size:clamp(40px,4.4vw,66px);line-height:1.02;letter-spacing:.01em}
.kick{font:400 clamp(20px,1.8vw,24px)/1.2 var(--hand);color:var(--rust)}
.txt p{margin:0 0 18px;max-width:34em}
.dek{font:italic 400 clamp(19px,2vw,23px)/1.45 var(--body);color:var(--soft)}
.by{font:600 12px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--soft);margin-top:20px}
.subs{display:grid;grid-template-columns:1fr 1fr;gap:22px;border-top:1px solid rgba(35,51,126,.3);padding-top:18px;margin-top:8px}
.sub h3{font:600 17px/1.25 var(--body);color:var(--navy);margin:0 0 6px}
.sub p{font-size:15.5px;line-height:1.55;margin:0}
.cap{font-size:13.5px !important;line-height:1.45;font-style:italic;color:var(--soft);border-top:1px solid rgba(35,51,126,.22);padding-top:10px;margin-top:22px !important}
.navy h2,.navy h1{color:#F4EFE1}.navy .kick{color:#F0A57F}.navy .txt p{color:#E4DFD1}.navy .sub h3{color:#F4EFE1}.navy .subs,.navy .cap{border-color:rgba(244,239,225,.3)}.navy .cap{color:#C9C5BA}
.navy .ph{background:rgba(255,255,255,.06);outline-color:rgba(240,165,127,.55)}
.fcap{max-width:1260px;margin:18px auto 0;padding:0 max(22px,3vw);font-size:13.5px;font-style:italic;color:var(--soft);text-align:right}
.fcap span{display:block}

/* the collage stage: every piece is placed by percentages */
.stage{position:relative;aspect-ratio:var(--ar)}
.pc{position:absolute;left:var(--l);top:var(--t);width:var(--w);height:auto;transform:rotate(var(--r));z-index:var(--z);user-select:none;-webkit-user-drag:none}
img.pc{cursor:zoom-in}img.pc.deco{cursor:default;pointer-events:none;filter:drop-shadow(0 3px 3px rgba(50,40,20,.2))}body.editing img.pc.deco{pointer-events:auto}img.pc.doily{cursor:default;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(50,40,20,.22))}
.arrow{overflow:visible;pointer-events:none}
.polawrap .fr{margin:0;max-width:none;transform:none}.polawrap figcaption{display:none}
.polawrap .pola{filter:drop-shadow(0 16px 18px rgba(38,30,18,.32))}
.pull{font-feature-settings:'liga' 0;max-width:820px;margin:56px auto 0;padding:0 max(22px,3vw);text-align:center;font:italic 400 clamp(28px,3vw,40px)/1.3 var(--body);color:var(--navy)}
.pull cite{display:block;margin-top:12px;font:400 22px var(--hand);font-style:normal;color:var(--rust)}
.recon{max-width:1260px;margin:26px auto 0;padding:0 max(22px,3vw);font:600 11.5px var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--navy)}
.nbBtn{font:600 13px var(--body);letter-spacing:.14em;text-transform:uppercase;border:0;border-radius:999px;padding:13px 22px;background:var(--navy);color:#F4EFE1;cursor:pointer;box-shadow:3px 3px 0 #F2D98E}
.nbBtn:hover{background:#1A2766}
.nbLink{font:600 12px var(--body);letter-spacing:.14em;text-transform:uppercase;border:0;background:none;color:var(--rust);padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.nbPv{padding:0;border:0;background:none;cursor:pointer;filter:drop-shadow(0 14px 18px rgba(38,30,18,.28))}.nbPv img{display:block;width:100%}
.chip3d{margin-left:10px;vertical-align:4px;font:600 11px var(--body);letter-spacing:.14em;text-transform:uppercase;border:1px solid currentColor;border-radius:999px;padding:3px 9px;background:none;color:var(--navy);cursor:pointer;vertical-align:1px}
.navy .chip3d{color:#F0D9A8}.chip3d:hover{background:rgba(35,51,126,.08)}
.bar nav button.c3dOpen{font:600 12px var(--body);letter-spacing:.14em;text-transform:uppercase;border:1px solid rgba(35,51,126,.35);border-radius:999px;background:#FBF8EF;color:var(--navy);padding:6px 11px;cursor:pointer;white-space:nowrap;margin-left:6px}
img.pc.c3dOpen{cursor:pointer}
#c3d{position:fixed;inset:0;z-index:260;background:#F3EFE8}#c3d[hidden]{display:none}
#c3d iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
#c3dL{position:absolute;inset:0;display:grid;place-items:center;font:italic 400 20px var(--body);color:var(--soft);pointer-events:none}
 /* the teacup that keeps the reader company */
#pal{position:fixed;left:0;top:0;width:92px;z-index:80;pointer-events:none;will-change:transform;transition:opacity .4s}
#pal .cup{display:block;width:100%;filter:drop-shadow(0 8px 10px rgba(38,30,18,.22));transition:transform .45s cubic-bezier(.3,1.6,.5,1);transform-origin:50% 80%}
#pal .steam{position:absolute;left:0;top:-52%;width:100%;opacity:.85;transform-origin:45% 100%;animation:steam 3.4s ease-in-out infinite}
#pal.pour .cup{transform:rotate(-22deg) translateY(-4px)}#pal.pour .steam{opacity:0}
#pal.off{opacity:0}
@keyframes steam{0%,100%{transform:translateY(0) skewX(0) scaleY(1);opacity:.75}50%{transform:translateY(-6px) skewX(-6deg) scaleY(1.06);opacity:.95}}
.spk{position:fixed;left:0;top:0;width:12px;height:12px;z-index:79;pointer-events:none;background:var(--c,#D2B36A);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:spk .9s ease-out forwards}
@keyframes spk{from{opacity:1;transform:translate(var(--x),var(--y)) scale(1) rotate(0)}to{opacity:0;transform:translate(calc(var(--x) + var(--dx)),calc(var(--y) - 26px)) scale(.3) rotate(90deg)}}
@media (max-width:820px){#pal{width:66px}}
@media (prefers-reduced-motion:reduce){#pal{display:none}}
 /* the tools, laid out on a lace-edged placemat */
.toolroll{position:relative;max-width:1200px;margin:70px auto 0;padding:58px clamp(18px,3vw,44px) 46px;background:#F7F2E6 url(img/tx_paper_cream.jpg) center/cover;box-shadow:0 14px 30px rgba(20,16,30,.28);transform:rotate(-.6deg);width:calc(100% - 2*max(22px,3vw))}
.toolroll.grid{background-image:url(img/tx_paper_grid.jpg);transform:rotate(.5deg)}
.toolroll::before,.toolroll::after{content:'';position:absolute;left:-6px;right:-6px;height:44px;background:var(--lace) 0 0/auto 100% repeat-x;filter:drop-shadow(0 2px 2px rgba(50,40,20,.25))}
.toolroll::before{top:-22px}.toolroll::after{bottom:-22px;transform:scaleY(-1)}
.trk{font:400 clamp(26px,2.6vw,34px)/1.1 var(--hand);color:var(--navy);text-align:center;margin-bottom:26px}
.trk span{display:block;font:400 17px 'PenHand',var(--body);color:var(--soft);margin-top:4px}
.tritems{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:28px clamp(18px,2.6vw,40px)}
.tl{margin:0;display:flex;flex-direction:column;align-items:center;max-width:250px;transform:rotate(var(--r));transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.tl:hover{transform:rotate(0) translateY(-6px) scale(1.06)}
.tlimg{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;gap:4px 2px;max-width:250px}
.tlimg img{height:var(--h);width:auto;max-width:150px;object-fit:contain;filter:drop-shadow(0 4px 4px rgba(60,45,20,.18))}
.tlimg img:only-child{max-width:200px}
.tl figcaption{margin-top:8px;font:400 18px/1.15 'PenHand',var(--body);color:var(--ink);text-align:center;max-width:200px}
.tl figcaption small{display:block;font-size:14.5px;color:#9A6A4F;margin-top:2px}
@media (max-width:820px){.tritems{gap:20px 16px}.tlimg img{height:calc(var(--h) * .62)}.tlimg{max-width:170px}.tl{max-width:170px}.tl figcaption{font-size:15.5px}.tl figcaption small{font-size:13px}}
.end{position:relative;padding:90px max(22px,3vw) 80px;background:#23337E url(img/tx_paper_navy.jpg) center/cover;color:#D9D4C6;font-size:14px;text-align:center}

#lb{position:fixed;inset:0;z-index:90;background:rgba(20,18,26,.9);display:none;place-items:center;padding:4vh 4vw}#lb.on{display:grid}
#lb img{max-width:100%;max-height:88vh}#lb button{position:fixed;top:14px;right:16px;font:600 13px var(--body);border:0;border-radius:999px;padding:8px 14px;background:#F2EDE0;color:var(--navy);cursor:pointer}

@media (max-width:820px){
  :root{--tear:64px}
  .sw{--th:110px}.sw.diag{--th:190px}.seam .lace{--lh:56px}
  body{font-size:17.5px}
  .in,.spread.left .in,.cover .in{grid-template-columns:1fr;gap:22px}
  .stage{order:-1;aspect-ratio:var(--mar)}
  .pc{left:var(--ml,var(--l));top:var(--mt,var(--t));width:var(--mw,var(--w))}
  .subs{grid-template-columns:1fr}
  .spread{padding-bottom:80px}
  .bar .name{font-size:20px}
  .fcap{text-align:left}
}

/* plates: information graphics laid between the spreads */
.plband{padding-bottom:110px}
.plfig{max-width:1240px;margin:0 auto;padding:0 max(22px,3vw)}
.plfig .kick{text-align:center;margin-bottom:10px}
.plbtn{display:block;width:100%;border:0;padding:0;background:none;cursor:zoom-in}
.plimg{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 10px rgba(50,40,20,.18))}
.plfig .cap{max-width:62ch;margin:14px auto 0;text-align:center}
/* free explore mode: kraft tags tied to things in the pictures, hidden until the reader asks */
.bar nav button#xpTog{font:600 12px var(--body);letter-spacing:.14em;text-transform:uppercase;border:1px solid rgba(110,42,42,.45);border-radius:2px;background:#FBF8EF;color:#6E2A2A;padding:6px 11px;cursor:pointer;white-space:nowrap;margin-left:6px}
.bar nav button#xpTog[aria-pressed=true]{background:#6E2A2A;color:#FBF6EC;border-color:#6E2A2A}
.xtag{position:absolute;left:var(--l);top:var(--t);z-index:8;display:none;flex-direction:column;align-items:flex-start;gap:1px;transform:rotate(var(--r));transform-origin:0 50%;
  padding:7px 12px 8px 26px;border:0;background:#D8BC8E;color:#3E2A20;cursor:pointer;text-align:left;max-width:200px;
  clip-path:polygon(14px 0,100% 0,100% 100%,14px 100%,0 50%);filter:drop-shadow(0 3px 3px rgba(40,25,10,.3))}
.xtag::before{content:'';position:absolute;left:11px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:#F4ECDD;box-shadow:0 0 0 2px #B08D57}
.xtag .xk{font:400 17px/1 var(--hand);color:#6E2A2A}
.xtag .xn{font:500 13.5px/1.2 var(--body)}
.xtag:hover,.xtag:focus-visible{background:#E6CFA4}
body.explore .xtag{display:flex}
@media (prefers-reduced-motion:no-preference){body.explore .xtag{animation:xin .45s cubic-bezier(.2,.8,.3,1.3) both}@keyframes xin{from{transform:rotate(var(--r)) translateY(-8px) scale(.9);opacity:0}}}
#xp{position:fixed;inset:0;z-index:95;background:rgba(30,22,18,.9);overflow:auto;display:none;padding:64px max(16px,3vw) 40px}
#xp.on{display:block}
#xp .xph{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:14px;padding:12px max(16px,3vw);background:rgba(30,22,18,.94);z-index:2}
#xp .xph .xk{font:400 20px var(--hand);color:#E8B9A0}
#xp .xph h2{font:400 26px/1 var(--title);color:#F4ECDD;margin:0;font-variant-ligatures:none}
#xp .xph button{margin-left:auto;font:600 12px var(--body);letter-spacing:.14em;text-transform:uppercase;border:1px solid #F4ECDD;border-radius:2px;background:none;color:#F4ECDD;padding:7px 12px;cursor:pointer}
#xp img{display:block;margin:0 auto;width:min(1500px,100%);height:auto;background:#EFE6D6;padding:18px}
#xp .xpn{max-width:62ch;margin:14px auto 0;color:#D8CFC0;font:italic 15px var(--body);text-align:center}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><filter id="mk" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/></filter></defs></svg>
<div class="bar"><a class="name" href="#top">Repair Café</a><nav aria-label="Sections">{{NAV}}</nav><div id="prog"></div></div>
<main>
{{BODY}}
</main>
<div id="pal" aria-hidden="true"><img class="steam" src="img/pal_steam.webp" alt=""><img class="cup" src="img/pal_cup.webp" alt=""></div>
<div id="c3d" role="dialog" aria-modal="true" aria-label="The café in 3D" hidden><div id="c3dL">Setting the tables…</div><iframe id="c3dF" title="The café in 3D, an illustrated reconstruction" allow="fullscreen"></iframe></div>
<div id="xp" role="dialog" aria-modal="true" aria-labelledby="xpT"><div class="xph"><span class="xk" id="xpK">explore</span><h2 id="xpT"></h2><button id="xpX">Close</button></div><img id="xpImg" alt=""><p class="xpn" id="xpN"></p></div>
<div id="lb" role="dialog" aria-modal="true" aria-label="Picture"><img id="lbImg" alt=""><button id="lbX">Close</button></div>
<script>
(() => {
  const $ = s => document.querySelector(s);
  // first sheet has no torn top
  document.querySelector('.sw').classList.add('first');
  // progress and the current section in the bar
  const links = [...document.querySelectorAll('.bar nav a')], secs = links.map(a => document.querySelector(a.getAttribute('href')));
  const tick = () => { const h = document.documentElement; $('#prog').style.width = (h.scrollTop / Math.max(1, h.scrollHeight - innerHeight) * 100) + '%';
    let cur = -1; secs.forEach((s, i) => { if (s && s.getBoundingClientRect().top < innerHeight * .4) cur = i; }); links.forEach((a, i) => a.setAttribute('aria-current', i === cur)); };
  addEventListener('scroll', tick, { passive: true }); tick();
  // the marker writing on the polaroid needs its photo
  document.querySelectorAll('img[data-photo]').forEach(im => { im.src = 'img/' + im.dataset.photo + '.jpg'; });
  // pictures open larger
  document.querySelectorAll('img.pc:not(.c3dOpen):not(.doily):not(.deco), .pola img').forEach(im => im.addEventListener('click', () => { $('#lbImg').src = im.src; $('#lbImg').alt = im.alt; $('#lb').classList.add('on'); $('#lbX').focus(); }));
  $('#lbX').onclick = () => $('#lb').classList.remove('on'); $('#lb').onclick = e => { if (e.target.id === 'lb') $('#lb').classList.remove('on'); };
  addEventListener('keydown', e => { if (e.key === 'Escape') $('#lb').classList.remove('on'); });
  // plates and explore: one scrolling viewer at full size
  let xpBack = null;
  function xpOpen(src, name, kind, btn) { xpBack = btn; $('#xpImg').src = src; $('#xpImg').alt = 'Information plate: ' + name; $('#xpT').textContent = name; $('#xpK').textContent = kind;
    $('#xpN').textContent = kind === 'explore' ? 'An optional page from the tables. It sits outside the essay.' : ''; $('#xp').classList.add('on'); $('#xp').scrollTop = 0; $('#xpX').focus(); }
  function xpClose() { $('#xp').classList.remove('on'); if (xpBack) xpBack.focus({ preventScroll: true }); }
  document.querySelectorAll('.plbtn').forEach(b => b.addEventListener('click', () => xpOpen('img/pl_' + b.dataset.pl + '.webp', b.dataset.name, 'plate', b)));
  document.querySelectorAll('.xtag').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); xpOpen('img/x_' + b.dataset.x + '.webp', b.dataset.name, 'explore', b); }));
  $('#xpX').onclick = xpClose; $('#xp').onclick = e => { if (e.target.id === 'xp') xpClose(); };
  addEventListener('keydown', e => { if (e.key === 'Escape' && $('#xp').classList.contains('on')) xpClose(); });
  const xt = $('#xpTog'); if (xt) xt.addEventListener('click', () => { const on = !document.body.classList.contains('explore'); document.body.classList.toggle('explore', on); xt.setAttribute('aria-pressed', on); xt.textContent = on ? 'Explore on' : 'Explore'; });

  // the café in 3D: loaded only when asked for, laid over the essay, and it hands the reader back
  const c3 = $('#c3d'), F = $('#c3dF'); let back3 = null, ready3 = false;
  function open3d(id) {
    back3 = document.activeElement; c3.hidden = false; document.documentElement.style.overflow = 'hidden';
    if (!F.getAttribute('src')) { F.src = 'cafe3d.html#' + (id || 'entrance'); F.addEventListener('load', () => { $('#c3dL').style.display = 'none'; }, { once: true });
      // if this page cannot frame the café, offer it in its own tab
      setTimeout(() => { if (!ready3) { $('#c3dL').style.display = 'grid'; $('#c3dL').style.pointerEvents = 'auto'; F.style.visibility = 'hidden';
        $('#c3dL').innerHTML = '<p style="text-align:center;max-width:30em;padding:0 20px">The 3D café could not open inside this page.<br><a href="cafe3d.html" target="_blank" rel="noopener">Open it in its own tab</a> · <button class="c3x" style="font:inherit;border:0;background:none;color:inherit;text-decoration:underline;cursor:pointer">Back to the essay</button></p>';
        $('#c3dL .c3x').onclick = close3d; } }, 45000); }
    else F.contentWindow.postMessage({ cafe: 'go', id: id || 'entrance' }, '*');
    F.focus();
  }
  function close3d() { c3.hidden = true; document.documentElement.style.overflow = ''; if (back3 && back3.focus) back3.focus({ preventScroll: true }); dispatchEvent(new Event('scroll')); }
  addEventListener('message', e => { if (e.source !== F.contentWindow) return; const m = e.data || {};
    if (m.cafe === 'ready') { ready3 = true; F.style.visibility = ''; $('#c3dL').style.display = 'none'; }
    if (m.cafe === 'close') close3d();
    if (m.cafe === 'read') { close3d(); const s = document.getElementById(m.id); if (s) s.scrollIntoView(); } });
  document.addEventListener('click', e => { const b = e.target.closest('.c3dOpen'); if (!b) return; e.preventDefault();
    if (window.__nb && !document.getElementById('nb').hidden) window.__nb.close(); open3d(b.dataset.view); });
  addEventListener('keydown', e => { if (e.key === 'Escape' && !c3.hidden) close3d(); });
  if (location.hash === '#cafe3d') open3d('entrance');
  // the teacup: follows the mouse at a polite distance, rests in the corner when the reader is still, drifts as you scroll
  const pal = $('#pal');
  if (pal && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const fine = matchMedia('(pointer: fine)').matches, clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    let x = innerWidth - 150, y = innerHeight - 190, tx = x, ty = y, vx = 0, vy = 0, last = -1e9, lastY = scrollY, sv = 0, spT = 0;
    const home = () => [innerWidth - (innerWidth < 820 ? 88 : 140), innerHeight - (innerWidth < 820 ? 120 : 175)];
    addEventListener('pointermove', e => { if (e.pointerType !== 'mouse') return; tx = e.clientX + 26; ty = e.clientY + 14; last = performance.now();
      pal.classList.toggle('pour', !!e.target.closest('a, button, img.pc')); }, { passive: true });
    addEventListener('scroll', () => { sv += scrollY - lastY; lastY = scrollY; }, { passive: true });
    const COLS = ['#D2B36A', '#F2B8C6', '#E6CF95', '#CDB8E6'];
    function spark(px, py) {
      const s = document.createElement('i'); s.className = 'spk';
      s.style.cssText = `--x:${px}px;--y:${py}px;--dx:${(Math.random() - .5) * 30}px;--c:${COLS[Math.random() * 4 | 0]};width:${6 + Math.random() * 8}px;height:${6 + Math.random() * 8}px`;
      document.body.appendChild(s); setTimeout(() => s.remove(), 950);
    }
    (function tick(t) {
      const busy = !$('#c3d').hidden || (document.getElementById('nb') && !document.getElementById('nb').hidden);
      pal.classList.toggle('off', busy);
      if (!fine || t - last > 2600) { [tx, ty] = home(); ty += Math.sin(t / 900) * 9; tx += Math.cos(t / 1300) * 5; pal.classList.remove('pour'); }
      const drift = clamp(sv * .5, -90, 90); sv *= .88;
      vx = (vx + (tx - x) * .055) * .8; vy = (vy + (ty + drift - y) * .055) * .8; x += vx; y += vy;
      pal.style.transform = `translate(${x}px, ${y}px) rotate(${clamp(vx * 1.4, -16, 16)}deg)`;
      const sp = Math.hypot(vx, vy);
      if (!busy && sp > 2.2 && t - spT > 55) { spT = t; spark(x + pal.offsetWidth * .5 + (Math.random() - .5) * 30, y + pal.offsetWidth * .9); }
      requestAnimationFrame(tick);
    })(performance.now());
  }
  window.__ok = true;
})();
</script>
