<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order Up</title>
<style>
{{FONTS}}
/* Layout: the scrolling form of the mint ice cream piece, dressed as a patisserie. A centred title and a flat-lay of the
   café's objects; sticky stages built as little sets (a pastry case, a place setting, a papered wall, a velvet tray,
   a counter) hold still while menu cards scroll past; plain prose runs between. Single committed light look. */
:root{
  --paper:#EAF0F6; --card:#FFFDFA; --ink:#1F2B50; --text:#2B3355; --soft:#666C84; --rose:#B8566A; --rose2:#F4DCE0; --blush:#F7E6E9; --gold:#B08D57; --gold2:#E6D3A4; --blue:#9CC2E6; --rule:rgba(31,43,80,.14);
  --title:'Roffelia',Georgia,serif; --body:'Newsreader',Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--paper);color:var(--text);font:400 19px/1.68 var(--body);overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(rgba(31,43,80,.09) 1px,transparent 1.3px);background-size:22px 22px;z-index:0}
.grain{position:fixed;inset:0;pointer-events:none;z-index:90;opacity:.32;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .55  0 0 0 .2 0'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>")}
main{position:relative;z-index:1}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.lab{font:600 12px/1.3 var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--soft)}
.ph{background:repeating-linear-gradient(-45deg,rgba(184,86,106,.06) 0 7px,transparent 7px 14px);outline:1px dashed rgba(184,86,106,.42);border-radius:3px;padding:0 3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--gold);outline-offset:3px}
{{FRAMES}}
.stamp{display:inline-block;font:700 12px/1.3 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--c,var(--rose));border:2.5px solid currentColor;border-radius:7px 5px 8px 6px;padding:4px 10px 3px;transform:rotate(var(--r,-4deg));filter:url(#rough)}
.orn{display:block;width:min(420px,80%);height:auto;margin:10px auto;color:var(--gold)}

/* stickers */
.stk{position:absolute;display:block;height:auto;transform:translate(-50%,-50%) rotate(var(--r,0deg));filter:drop-shadow(0 1.5px 1px rgba(31,43,80,.18)) drop-shadow(0 10px 12px rgba(31,43,80,.16));transition:left .9s cubic-bezier(.5,0,.2,1),top .9s cubic-bezier(.5,0,.2,1),width .9s cubic-bezier(.5,0,.2,1),opacity .6s,transform .6s;user-select:none;-webkit-user-drag:none}
.lay{position:absolute;pointer-events:none;transition:opacity .7s}
@media (prefers-reduced-motion: reduce){.stk{transition:opacity .3s}}

/* hero: a centred title in a cartouche, then a flat-lay */
.hero{text-align:center;padding:28px 0 10px}
.hero .feature{margin-bottom:0}.hero .feature figcaption{margin:14px auto 0;max-width:62ch;position:relative;z-index:3}
.hero .cart{margin-top:22px;z-index:2}
.hero .lab{color:var(--rose)}
.hero h1{font:400 clamp(52px,8vw,108px)/1 var(--title);color:var(--ink);margin:18px auto 14px;max-width:14ch;text-wrap:balance}
.hero .dek{font:italic 400 clamp(19px,2.3vw,24px)/1.45 var(--body);color:var(--soft);margin:0 auto;max-width:36ch}
.hero .byline{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 16px;margin-top:22px}
.hero .byline span+span::before{content:"✦";margin-right:16px;color:var(--gold);font-size:10px}
.flatlay{position:relative;margin:44px auto 10px;max-width:1080px;background:var(--blush);border-radius:6px;padding:40px 34px 28px;box-shadow:0 30px 60px -40px rgba(31,43,80,.5)}
.flatlay::before{content:"";position:absolute;inset:12px;border:1px solid rgba(184,86,106,.28);pointer-events:none}
.flatlay .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:18px 12px;align-items:end}
.flatlay figure{margin:0;display:grid;justify-items:center;gap:6px}
.flatlay figure img{width:var(--w,78%);height:auto;transform:rotate(var(--r,0deg));filter:drop-shadow(0 1.5px 1px rgba(31,43,80,.16)) drop-shadow(0 10px 10px rgba(31,43,80,.14));transition:transform .25s}
.flatlay figure:hover img{transform:rotate(calc(var(--r,0deg) * -1)) translateY(-5px) scale(1.04)}
.flatlay figcaption{font:italic 400 14px var(--body);color:#8A5F68}
.flatlay .sig{position:absolute;right:30px;bottom:12px;font:italic 400 13px var(--body);color:#A7838A}

/* prose */
.prose{max-width:660px;margin:0 auto;padding:46px 18px 26px;position:relative}
.prose p{margin:0 0 22px}
.prose p.lede::first-letter{float:left;font:400 86px/.82 var(--title);color:var(--rose);padding:10px 12px 0 0}
.prose h2{font:400 clamp(36px,4.8vw,54px)/1.08 var(--title);color:var(--ink);margin:6px 0 20px;text-wrap:balance;text-align:center}
.prose .lab.c{text-align:center;color:var(--rose)}
.aside{position:absolute;display:grid;justify-items:center;gap:4px;width:150px}
.aside img{width:100%;height:auto;transform:rotate(var(--r,6deg));filter:drop-shadow(0 8px 10px rgba(31,43,80,.18))}
.aside span{font:italic 400 13px var(--body);color:var(--soft)}
@media (max-width:1120px){.aside{display:none}}
.pull{position:relative;margin:40px 0;padding:34px 34px 24px;background:var(--card);text-align:center;box-shadow:0 20px 40px -30px rgba(31,43,80,.5)}
.pull::before{content:"";position:absolute;inset:8px;border:1px solid var(--gold2);pointer-events:none}
.pull p{font:400 32px/1.25 var(--title);color:var(--ink);margin:0 0 10px}
.pull .flo{width:44px;height:44px}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;margin:30px 0;padding:22px;background:var(--card);position:relative;box-shadow:0 20px 40px -30px rgba(31,43,80,.5)}
.pair::before{content:"";position:absolute;inset:8px;border:1px solid var(--gold2);pointer-events:none}
.pair img{width:100%;height:auto;filter:drop-shadow(0 8px 10px rgba(31,43,80,.16))}
.pair .arrow{font:400 44px var(--title);color:var(--rose)}
.pair .cap{grid-column:1/-1;display:flex;justify-content:space-around}

/* scrollytelling */
.scrolly{position:relative;margin-block:30px}
.stage{position:sticky;top:0;height:100vh;height:100svh;display:grid;place-items:center;overflow:hidden;z-index:1}
.board{position:relative;width:min(94vw,1080px,calc((100svh - 40px) / .66));aspect-ratio:1/.66}
.steps{position:relative;z-index:2;margin-top:-100vh;margin-top:-100svh;padding-bottom:30vh;pointer-events:none}
.step{min-height:95vh;min-height:95svh;display:flex;align-items:flex-end;justify-content:flex-start;padding:0 max(18px,4vw) 7svh}
.step:first-child{min-height:105svh}
.step.right{justify-content:flex-end}
.card{position:relative;pointer-events:auto;width:min(100%,26rem);background:rgba(255,253,250,.96);padding:22px 26px 16px;box-shadow:0 26px 46px -28px rgba(31,43,80,.5)}
.card::before{content:"";position:absolute;inset:7px;border:1px solid var(--gold2);pointer-events:none}
.card .flo{width:36px;height:36px}
.card .lab{color:var(--rose);margin-bottom:4px}
.card h3{font:400 34px/1.08 var(--title);color:var(--ink);margin:2px 0 8px}
.card p{font-size:17px;line-height:1.55;margin:0 0 10px}
.card .note{font-size:13.5px;font-style:italic;color:var(--soft)}

/* set: the pastry case */
.case{position:absolute;left:7%;right:7%;top:9%;bottom:3%;border-radius:20px 20px 10px 10px;background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(226,236,246,.55));box-shadow:inset 0 0 0 4px #FFFDFA,inset 0 0 0 6px rgba(176,141,87,.75),0 34px 54px -30px rgba(31,43,80,.55)}
.case .crown{position:absolute;left:-2%;right:-2%;top:-7%;height:9%;border-radius:14px 14px 4px 4px;background:linear-gradient(180deg,#F6E2A8,#C49E5B);box-shadow:0 6px 10px -4px rgba(60,40,10,.35)}
.case .crown span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:400 clamp(16px,2.2vw,28px) var(--title);color:#3A2C12;white-space:nowrap}
.case .val{position:absolute;left:0;right:0;top:2%;height:6%;background:repeating-linear-gradient(90deg,#F2C4CC 0 3%,#FFFDFA 3% 6%)}
.case .val::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:11px;background:radial-gradient(circle at 50% 0,#F2C4CC 9.5px,transparent 10px) 0 0/6% 11px}
.shelf{position:absolute;left:7.5%;right:7.5%;height:5px;border-radius:3px;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(176,200,222,.7));box-shadow:0 6px 8px -4px rgba(31,43,80,.3)}
.glare{position:absolute;inset:0;border-radius:20px 20px 10px 10px;background:linear-gradient(115deg,transparent 0 14%,rgba(255,255,255,.35) 14% 17%,transparent 17% 21%,rgba(255,255,255,.22) 21% 22.5%,transparent 22.5% 70%,rgba(255,255,255,.25) 70% 73%,transparent 73%);pointer-events:none;z-index:6}
.plaque{position:absolute;transform:translateX(-50%);background:linear-gradient(180deg,#F6E2A8,#C49E5B);color:#3A2C12;font:600 10.5px var(--body);letter-spacing:.18em;text-transform:uppercase;padding:4px 10px;border-radius:2px;box-shadow:0 3px 6px rgba(60,40,10,.25);white-space:nowrap;opacity:0;transition:opacity .6s;z-index:5}

/* ticket rail across the case, and lace along the shelf edges */
.rail{position:absolute;left:9%;right:9%;height:6px;border-radius:3px;background:linear-gradient(180deg,#F6E2A8,#B48A49);box-shadow:0 4px 6px -2px rgba(60,40,10,.35);transition:opacity .6s;z-index:2}
.shelf::after{content:"";position:absolute;left:0;right:0;top:5px;height:9px;background:radial-gradient(circle at 50% 0,#FFFFFF 5.5px,transparent 6px) 0 0/13px 9px;opacity:.95}
/* set: the place setting */
.cloth{position:absolute;inset:3% 3% 3% 3%;background:#FFFCF6;border-radius:8px;box-shadow:0 30px 50px -30px rgba(31,43,80,.5)}
.cloth::before{content:"";position:absolute;inset:0;border-radius:8px;background:radial-gradient(circle,rgba(200,168,102,.12) 2px,transparent 2.5px) 0 0/26px 26px}
.cloth::after{content:"";position:absolute;inset:10px;border:1.5px dashed rgba(184,86,106,.35);border-radius:4px}
.lace{position:absolute;left:3%;right:3%;height:16px;background:radial-gradient(circle at 50% 0,#FFFCF6 8px,transparent 8.5px) 0 0/18px 16px,radial-gradient(circle at 50% 4px,rgba(184,86,106,.25) 1.6px,transparent 2px) 0 0/18px 16px}
.charger{position:absolute;left:50%;top:50%;width:44%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#FFFFFF 60%,#E7EEF6 61%,#FFFFFF 63%,#FFFFFF 68%,#C8A866 68.6%,#FFFFFF 69.6%),#FFF;box-shadow:0 20px 30px -18px rgba(31,43,80,.45),inset 0 -8px 16px rgba(31,43,80,.06)}
.charger::before{content:"";position:absolute;inset:3%;border-radius:50%;background:repeating-conic-gradient(rgba(156,194,230,.8) 0 4deg,transparent 4deg 10deg);-webkit-mask:radial-gradient(circle,transparent 64%,#000 64.5%,#000 67%,transparent 67.5%);mask:radial-gradient(circle,transparent 64%,#000 64.5%,#000 67%,transparent 67.5%)}
.napkin{position:absolute;left:9%;top:22%;width:11%;aspect-ratio:1;background:linear-gradient(135deg,#F2C4CC 50%,#E9AEB9 50%);clip-path:polygon(0 0,100% 0,0 100%);transform:rotate(-8deg);filter:drop-shadow(0 6px 6px rgba(31,43,80,.15))}
.placecard{position:absolute;right:9%;top:9%;background:#FFFDFA;padding:8px 14px;box-shadow:0 8px 14px -8px rgba(31,43,80,.4);transform:rotate(4deg);text-align:center;z-index:2}
.placecard b{display:block;font:400 22px var(--title);color:var(--ink)}
.placecard span{font:600 10px var(--body);letter-spacing:.18em;color:var(--soft)}

/* set: the papered wall */
.wallp{position:absolute;inset:2% 4%;border-radius:10px;background:repeating-linear-gradient(90deg,#F7E4E8 0 22px,#FBF0F2 22px 44px);box-shadow:0 30px 50px -30px rgba(31,43,80,.5)}
.panel{position:absolute;left:10%;right:10%;top:16%;bottom:10%;border:2px solid rgba(176,141,87,.85);box-shadow:inset 0 0 0 6px rgba(255,253,250,.6),inset 0 0 0 7.5px rgba(176,141,87,.55)}
.panel .flo{color:#B08D57;width:56px;height:56px}
.garland{position:absolute;left:4%;width:92%;top:2%;height:auto}
.medal{position:absolute;border-radius:50%;padding:2.2%;background:conic-gradient(from 200deg,#F7E7B4,#C49E5B,#F4DC9C,#B48A49,#F2D896,#C49E5B,#F7E7B4);box-shadow:0 24px 34px -20px rgba(31,43,80,.55);transition:opacity .6s,transform .6s}
.medal .in{width:100%;height:100%;border-radius:50%;overflow:hidden;background:#FFFCF4;box-shadow:inset 0 0 0 4px #FFFCF4,inset 0 0 0 5px rgba(176,141,87,.5);position:relative}
.medal .in img{position:absolute;inset:8%;width:84%;height:84%;object-fit:contain;transition:opacity .45s}
.medal .in img.photo{inset:0;width:100%;height:100%;object-fit:cover}
.ribbon{position:absolute;transform:translateX(-50%);background:#F2C4CC;color:#7A2E3E;font:600 11px var(--body);letter-spacing:.16em;text-transform:uppercase;padding:6px 18px;white-space:nowrap;clip-path:polygon(0 0,100% 0,96% 50%,100% 100%,0 100%,4% 50%);transition:opacity .6s}
.reconTag{position:absolute;left:12%;top:19%;z-index:4}

/* set: the velvet tray */
.velvet{position:absolute;inset:2% 3%;border-radius:14px;background:radial-gradient(120% 90% at 50% 40%,#36447A 0%,#24305C 70%,#1C264B 100%);box-shadow:inset 0 0 0 3px #C8A866,inset 0 0 0 8px rgba(31,43,80,.6),inset 0 0 0 9px rgba(200,168,102,.5),0 30px 50px -30px rgba(31,43,80,.6)}
.velvet::after{content:"";position:absolute;inset:0;border-radius:14px;opacity:.35;mix-blend-mode:screen;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.4' numOctaves='2'/><feColorMatrix values='0 0 0 0 .6  0 0 0 0 .65  0 0 0 0 .9  0 0 0 .25 0'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>")}
.lbl{position:absolute;font:600 10.5px var(--body);letter-spacing:.18em;text-transform:uppercase;color:#F6E7C1;white-space:nowrap;transition:opacity .6s;z-index:4}
.lbl::before{content:"";position:absolute;left:50%;top:100%;width:1px;height:var(--h,40px);background:rgba(246,231,193,.7)}
.lbl.under::before{top:auto;bottom:100%}

/* set: the counter */
.backwall{position:absolute;inset:2% 3% 30% 3%;border-radius:10px 10px 0 0;background:repeating-linear-gradient(90deg,#E6EEF6 0 30px,#EEF3F9 30px 60px)}
.counterTop{position:absolute;left:1%;right:1%;bottom:12%;height:20%;border-radius:10px;background:linear-gradient(180deg,#FFFFFF 0%,#F4F1EC 30%,#E9E4DD 100%);box-shadow:0 20px 30px -16px rgba(31,43,80,.45)}
.counterTop::before{content:"";position:absolute;inset:0;border-radius:10px;background:linear-gradient(115deg,transparent 30%,rgba(160,170,190,.22) 31%,transparent 33%,transparent 60%,rgba(160,170,190,.18) 61%,transparent 62.5%)}
.receipt{position:absolute;left:5%;top:9%;width:24%;background:#FFFFFF;padding:14px 16px 18px;box-shadow:0 14px 20px -12px rgba(31,43,80,.4);transform:rotate(-2deg);transition:opacity .6s,transform .6s;-webkit-mask:linear-gradient(#000 calc(100% - 8px),transparent 0),radial-gradient(circle at 6px 100%,transparent 5px,#000 5.5px) 0 100%/12px 8px repeat-x;mask:linear-gradient(#000 calc(100% - 8px),transparent 0),radial-gradient(circle at 6px 100%,transparent 5px,#000 5.5px) 0 100%/12px 8px repeat-x}
.receipt h4{font:400 24px var(--title);color:var(--ink);margin:0 0 6px;text-align:center}
.receipt .ln{display:flex;gap:6px;font:500 12.5px var(--body);color:var(--text);margin:4px 0}
.receipt .ln span:nth-child(2){flex:1;border-bottom:1.5px dotted rgba(31,43,80,.3);transform:translateY(-4px)}
.receipt .tot{border-top:1px dashed rgba(31,43,80,.3);margin-top:8px;padding-top:6px;font-weight:700}
.slotglass{position:absolute;border-radius:50%;border:2px dashed rgba(184,86,106,.6);display:grid;place-items:center;text-align:center;font:400 20px/1.1 var(--title);color:var(--rose);transition:opacity .6s;z-index:4}

.trayBox{position:absolute;left:3%;right:3%;top:50%;aspect-ratio:1500/990;transform:translateY(-50%);z-index:2}
.tray{position:absolute;inset:0;width:100%;height:100%;transition:opacity .8s;filter:drop-shadow(0 14px 16px rgba(5,8,25,.45))}
.labels{position:absolute;inset:0;pointer-events:none}
.lbl{transform:translateX(-50%);background:rgba(22,28,64,.82);padding:4px 9px 3px;border-radius:2px;box-shadow:0 0 0 1px rgba(246,231,193,.35)}
.loupe{position:absolute;width:36%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) scale(.7);transition:opacity .7s,transform .7s cubic-bezier(.3,1.3,.6,1);z-index:5;padding:2.2%;background:conic-gradient(from 210deg,#F7E7B4,#C49E5B,#F4DC9C,#B48A49,#F2D896,#C49E5B,#F7E7B4);box-shadow:0 30px 40px -18px rgba(5,8,25,.7)}
.loupe .lz{position:absolute;inset:7%;border-radius:50%;background-color:#2A3768;background-repeat:no-repeat;box-shadow:inset 0 0 0 3px rgba(255,250,230,.7),inset 0 10px 30px rgba(255,255,255,.25)}
.loupe::after{content:"";position:absolute;right:-24%;bottom:-24%;width:36%;height:9%;border-radius:6px;background:linear-gradient(180deg,#F6E2A8,#B48A49);transform:rotate(45deg);transform-origin:left center;box-shadow:0 8px 10px -4px rgba(5,8,25,.6)}
.velvet + .trayBox ~ .plaque{color:#3A2C12}
/* frames used inside the sets */
.fstk{transform:translate(-50%,-50%) rotate(var(--r,0deg))}
.mini img{display:block;width:100%;height:auto}
.stampm{padding:4.5%;background:radial-gradient(circle at 7px 7px,transparent 4.6px,#FFFFFF 5.2px) -7px -7px/14px 14px}
.stampm .in{background:#fff;padding:3%;box-shadow:inset 0 0 0 1px rgba(31,43,80,.12)}
.platem{border-radius:50%;padding:7%;aspect-ratio:1;background:radial-gradient(circle,#FFFFFF 63%,#E7EEF6 64%,#FFFFFF 66%,#FFFFFF 70%,#C8A866 70.5%,#FFFFFF 71.5%);box-shadow:0 18px 26px -16px rgba(5,8,25,.6)}
.platem .well{width:100%;height:100%;border-radius:50%;overflow:hidden;box-shadow:0 0 0 3px #fff,0 0 0 4px rgba(200,168,102,.8)}
.platem .well img{width:100%;height:100%;object-fit:cover}
/* hero cartouche and flat-lay sizes */
.cart{position:relative;max-width:760px;margin:0 auto;padding:40px 40px 30px;background:var(--card);box-shadow:0 30px 60px -40px rgba(31,43,80,.5)}
.cart::before{content:"";position:absolute;inset:10px;border:1.5px solid #C8A866;pointer-events:none}
.cart::after{content:"";position:absolute;inset:15px;border:.8px solid rgba(200,168,102,.6);pointer-events:none}
.cart .flo{width:64px;height:64px;color:#B08D57}
.cart .flo.tl{left:4px;top:4px}.cart .flo.tr{right:4px;top:4px}.cart .flo.bl{left:4px;bottom:4px}.cart .flo.br{right:4px;bottom:4px}
.flatlay .grid{grid-auto-flow:dense}
.flatlay figure.big{grid-column:span 2;grid-row:span 2}.flatlay figure.big img{--w:100%}
.flatlay figure.tall{grid-row:span 2}.flatlay figure.tall img{--w:70%}
.scrollcue{display:inline-block;margin-top:16px;color:var(--rose);text-decoration:none;border-bottom:1px solid var(--gold2);padding-bottom:3px}
.card .flo.tl{left:-3px;top:-3px}.card .flo.tr{right:-3px;top:-3px}.card .flo.bl{left:-3px;bottom:-3px}.card .flo.br{right:-3px;bottom:-3px}
.pull .flo.tl,.pair .flo.tl{left:-4px;top:-4px}.pull .flo.tr,.pair .flo.tr{right:-4px;top:-4px}.pull .flo.bl,.pair .flo.bl{left:-4px;bottom:-4px}.pull .flo.br,.pair .flo.br{right:-4px;bottom:-4px}
.pair .flo{width:40px;height:40px}

/* sticker album */
.album{padding:40px 0 60px}
.album h2{font:400 clamp(38px,5vw,58px)/1.06 var(--title);color:var(--ink);margin:6px 0 8px;text-align:center}
.album > .wrap > p{text-align:center;max-width:46ch;margin:0 auto;color:var(--soft)}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:22px;margin-top:30px}
.pg{position:relative;background:var(--card);padding:26px 24px 18px;box-shadow:0 24px 46px -32px rgba(31,43,80,.55)}
.pg::before{content:"";position:absolute;inset:8px;border:1px solid var(--gold2);pointer-events:none}
.pg h3{font:400 32px var(--title);color:var(--ink);margin:0 0 10px;text-align:center}
.pg .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px 6px}
.pg figure{margin:0;display:grid;justify-items:center;gap:2px}
.pg figure img{width:86%;height:auto;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 1px 1px rgba(31,43,80,.16)) drop-shadow(0 6px 7px rgba(31,43,80,.12));transform:rotate(var(--r,0deg));transition:transform .2s}
.pg figure:hover img{transform:rotate(calc(var(--r,0deg) * -1)) translateY(-3px) scale(1.08)}
.pg figcaption{font:italic 400 12px/1.2 var(--body);color:var(--soft);text-align:center}
footer.end{padding:30px 0 70px;font-size:14px;color:var(--soft);text-align:center}

#lb{position:fixed;inset:0;z-index:95;background:rgba(25,22,30,.88);display:none;place-items:center;padding:4vh 4vw}
#lb.on{display:grid}#lb img{max-width:100%;max-height:86vh;border-radius:6px}#lb .btn{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));right:18px;border-radius:999px;border:0;background:#FFFDFA;padding:8px 14px}

@media (max-width:760px){
  .hero .feature{margin:0 -18px}.hero .feature .fimg img.ph-img{border-radius:0}
  body{font-size:18px}
  .flatlay{padding:28px 14px 30px}.flatlay .grid{grid-template-columns:repeat(3,1fr)}
  .stage{place-items:start center;padding-top:4svh}
  .board{width:97vw;aspect-ratio:1/.92}
  .step{padding:0 10px 4svh}
  .card{padding:16px 18px 10px}.card h3{font-size:28px}
  .pg .grid{grid-template-columns:repeat(4,1fr)}
  .receipt{width:36%;padding:8px 10px 12px}.receipt h4{font-size:17px}.receipt .ln{font-size:10px}
  .plaque,.lbl,.ribbon{font-size:8.5px;letter-spacing:.08em;padding:3px 6px}
  .pair{grid-template-columns:1fr;text-align:center}.pair .arrow{transform:rotate(90deg)}
}
/* desktop: the set on the left, the menu cards in a column on the right */
@media (min-width:1100px){
  .stage{justify-items:start;padding-left:max(24px,3vw)}
  .board{width:min(calc(100vw - 26rem - 9vw),calc((100svh - 60px) / .66))}
  .step,.step.right{justify-content:flex-end;align-items:center;padding:0 max(24px,3vw) 0 0}
  .step:first-child{align-items:flex-end;padding-bottom:20svh}
}
</style>
