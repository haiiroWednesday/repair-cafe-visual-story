<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The cuckoo clock</title>
<!--FONTS--></head><body>
<script src="core.js"></script>
<script>
/* A weight-driven cuckoo clock on a papered café wall, as it came in: chains off their wheels, weights on the floor.
   Educational reconstruction of the repair Jazz described (chains off the cogwheels, fed back on, tied for the trip);
   the movement inside is a simplified, representative one. x = depth, y = width (+y viewer-left), z = up. */

/* ---------- dimensions (cm-ish) ---------- */
const ckXB = 2.5, ckXF = 16.5, ckY0 = 9, ckY1 = 31, ckYC = 20, ckZ0 = 60, ckZ1 = 87;
const ckWX = 14, ckWZ = 66.5, ckWR = 2.2;              // chain wheels: depth, height, radius
const ckTY = [13, 20, 27];                              // the three trains (time, cuckoo, music)
const ckHW0 = 19, ckHW1 = 47;                           // weight hook height, run down and fully wound
const ckPV = [4.5, 20, 61], ckPL = 26;                  // pendulum pivot and length
const ckDial = [20, 72, 6.2];
const ckDoor = [17.2, 22.8, 79.8, 85.6];
const ckBundle = [14.4, 20, 52.5];
const ckSpool = [22.5, 34.5];

const ckCASE = { l:'#c48a52', m:'#a36d3d', d:'#6a4424' };
const ckROOF = { l:'#8a5530', m:'#6e4123', d:'#432614' };
const ckCARVE = { l:'#9b6436', m:'#7d4e29', d:'#4e3018' };
const ckCONE = { l:'#a06c3a', m:'#7d522c', d:'#4d321b' };
const ckBRASS = { l:'#f0d184', m:'#cfa654', d:'#8c6a2a' };
const ckWALL = { l:'#f8e6ea', m:'#ecccd3', d:'#c9a3ab' };
const ckFLOOR = { l:'#f4ede1', m:'#ddd2bf', d:'#b4a68e' };
const ckRIBBON = { l:'#f2a1b8', m:'#d97e98', d:'#9c4d63' };
const ckCHAIN = '#c9a65a';

const ckClamp = (v, a=0, b=1) => Math.max(a, Math.min(b, v));
const ckLerp = (a, b, t) => a + (b - a) * t;
const ckLerp3 = (a, b, t) => [ckLerp(a[0],b[0],t), ckLerp(a[1],b[1],t), ckLerp(a[2],b[2],t)];
const ckLin = (a, b, n) => Array.from({length:n}, (_, i) => ckLerp3(a, b, i/(n-1)));
function ckSmooth(pts, it=3){
  for (let k=0;k<it;k++){ const o=[pts[0]];
    for (let i=0;i<pts.length-1;i++){ const a=pts[i], b=pts[i+1]; o.push(a.map((v,j)=>v*.75+b[j]*.25), a.map((v,j)=>v*.25+b[j]*.75)); }
    o.push(pts[pts.length-1]); pts=o; }
  return pts;
}
// a chain: ink links under brass links
function ckChain(pts){
  const d = pd(ckSmooth(pts), false);
  return `<path d="${d}" fill="none" stroke="${INK}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".9 .35"/>`
       + `<path d="${d}" fill="none" stroke="${ckCHAIN}" stroke-width=".9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".9 .35"/>`;
}
// a small ring on a plane
const ckRing = (pl, u, v, r, w=1.1) => `<path d="${pd(on(pl, ellUV(u, v, r, r, 14)))}" fill="none" stroke="${INK}" stroke-width="${w + .9}"/>`
  + `<path d="${pd(on(pl, ellUV(u, v, r, r, 14)))}" fill="none" stroke="${ckBRASS.m}" stroke-width="${w * .7}"/>`;

/* ---------- a pine-cone weight hanging (or lying) from its hook point along an axis ---------- */
const ckCONEPROF = [[0,.4],[.5,1.5],[2,2.2],[6,2.15],[9.5,1.7],[12,1],[13.4,.2]];
function ckCone(hook, ax){
  ax = norm(ax);
  const u = norm(cross(ax, Math.abs(ax[2]) < .9 ? [0,0,1] : [1,0,0])), v = cross(ax, u), n = 14;
  const at = d => [hook[0] + ax[0]*(d+1.1), hook[1] + ax[1]*(d+1.1), hook[2] + ax[2]*(d+1.1)];
  const rings = ckCONEPROF.map(([d, r]) => { const c = at(d); return Array.from({length:n}, (_, i) => { const t = i/n*2*Math.PI;
    return [c[0] + (u[0]*Math.cos(t) + v[0]*Math.sin(t))*r, c[1] + (u[1]*Math.cos(t) + v[1]*Math.sin(t))*r, c[2] + (u[2]*Math.cos(t) + v[2]*Math.sin(t))*r]; }); });
  let s = '';
  for (let k = 0; k < rings.length - 1; k++) s += loft(rings[k], rings[k+1], nr => toneI(nr, ckCONE));
  // cone scales: short arcs on the side that faces the viewer
  let sc = '';
  for (const [d, r, off] of [[3.4, 2.2, 0], [5.6, 2.18, .5], [7.8, 2.0, 0], [10, 1.6, .5]]){
    const c = at(d);
    for (let k = 0; k < 6; k++){ const t = (k + off)/6*2*Math.PI, dir = [u[0]*Math.cos(t)+v[0]*Math.sin(t), u[1]*Math.cos(t)+v[1]*Math.sin(t), u[2]*Math.cos(t)+v[2]*Math.sin(t)];
      if (dir[0] + dir[1] + dir[2] < .25) continue;
      const p = [c[0]+dir[0]*r, c[1]+dir[1]*r, c[2]+dir[2]*r], q = (a, b) => [p[0]+ax[0]*a+dir[0]*b, p[1]+ax[1]*a+dir[1]*b, p[2]+ax[2]*a+dir[2]*b];
      const side = norm(cross(ax, dir)), w = .9, e = (a, sgn) => [q(a,0)[0]+side[0]*w*sgn, q(a,0)[1]+side[1]*w*sgn, q(a,0)[2]+side[2]*w*sgn];
      sc += pd([e(-.9, -1), q(.2, .05), e(-.9, 1)], false); }
  }
  s += `<path d="${sc}" fill="none" stroke="${INK}" stroke-width=".7" stroke-linecap="round" opacity=".75"/>`;
  s += hullInk(rings.flat(), 1.6);
  // the hook loop
  const top = at(-.6);
  s += `<path d="${pd([hook, top], false)}" fill="none" stroke="${INK}" stroke-width="1.5"/><path d="${pd([hook, top], false)}" fill="none" stroke="${ckBRASS.m}" stroke-width=".6"/>`;
  return { svg: s, pts: rings.flat(), mid: at(6) };
}

/* ---------- carved maple leaf, in a plane's (u,v) ---------- */
const ckLEAF = [[0,-1],[.12,-.35],[.55,-.55],[.45,-.2],[.95,.05],[.6,.2],[.7,.6],[.3,.45],[0,1],[-.3,.45],[-.7,.6],[-.6,.2],[-.95,.05],[-.45,-.2],[-.55,-.55],[-.12,-.35]];
const ckLeafUV = (cu, cv, s, rot) => ckLEAF.map(([a, b]) => [cu + s*(a*Math.cos(rot) - b*Math.sin(rot)), cv + s*(a*Math.sin(rot) + b*Math.cos(rot))]);
function ckLeaf(pl, cu, cv, s, rot, m=ckCARVE, w=.9){
  const vein = [[0,-.95],[0,.8]].map(([a,b]) => [cu + s*(a*Math.cos(rot) - b*Math.sin(rot)), cv + s*(a*Math.sin(rot) + b*Math.cos(rot))]);
  return shape(on(pl, ckLeafUV(cu, cv, s, rot)), m.l, w) + ink(pd(on(pl, vein), false), .6);
}
// a toothed wheel in the plane x = const
function ckGear(x, y, z, r, teeth, ang, m, depth=.8){
  const pts = []; for (let i = 0; i < teeth*2; i++){ const a = ang + i/(teeth*2)*2*Math.PI, rr = i % 2 ? r*.84 : r; pts.push([y + rr*Math.cos(a), z + rr*Math.sin(a)]); }
  return shape(on(PX(x + depth), pts), m.l, .8) + shape(on(PX(x + depth + .05), ellUV(y, z, r*.42, r*.42, 14)), m.m, .6)
    + fill(pd(on(PX(x + depth + .1), ellUV(y, z, r*.12, r*.12, 8))), INK);
}
// a chain wheel: spikes that catch the links
function ckSprocket(y, ang){
  const pts = []; for (let i = 0; i < 20; i++){ const a = ang + i/20*2*Math.PI, rr = i % 2 ? ckWR*.72 : ckWR*1.05; pts.push([y + rr*Math.cos(a), ckWZ + rr*Math.sin(a)]); }
  return shape(on(PX(ckWX - .4), pts), '#d9dcde', .8) + fill(pd(on(PX(ckWX - .3), ellUV(y, ckWZ, .45, .45, 8))), INK);
}

/* ---------- where everything is, from the state ---------- */
const ckHw = st => i => ckLerp(ckHW0, ckHW1, st.w[i]);
function ckWeightPose(st, i){
  const s = ease(st.seat[i]), tw = ease(ckClamp(st.tie / .45)), y = ckTY[i] - 2.2;
  const lyingOff = { h: [12.2, y + .5, 4.6], ax: [1, -.2, 0] };
  const hang = { h: [ckWX, y, ckHw(st)(i)], ax: [0, 0, -1] };
  const lyingTie = { h: [12.8, y, 4.6], ax: [1, 0, 0] };
  let h = ckLerp3(lyingOff.h, hang.h, s), ax = ckLerp3(lyingOff.ax, hang.ax, s);
  if (s > 0 && s < 1) h[2] += Math.sin(Math.PI * s) * 3;
  if (tw > 0){ h = ckLerp3(h, lyingTie.h, tw); ax = ckLerp3(ax, lyingTie.ax, tw); if (tw < 1) h[2] += Math.sin(Math.PI * tw) * 2.5; }
  return { h, ax };
}
function ckStrands(st, i){
  const s = ease(st.seat[i]), tc = ease(ckClamp((st.tie - .3) / .5)), yw = ckTY[i] - 2.2, yr = ckTY[i] + 2.2;
  const Hw = [ckWX, yw, ckZ0], Hr = [ckWX, yr, ckZ0];
  const wp = ckWeightPose(st, i);
  // weight side: straight down to the hook, or (off its wheel) run out to the floor
  const end = st.tie > 0 ? [ckWX, yw, ckHw(st)(i)] : wp.h;
  const pileW = [Hw, [ckWX, yw + .3, 44], [ckWX - .2, yw + .7, 26], [ckWX - .5, yw + 1.1, 10], [13.4, yw + .9, 3.2], [12.8, yw + .7, 2.9], [12.2, yw + .5, 4.6]];
  let W = ckLin(Hw, end, 7).map((p, k) => ckLerp3(pileW[k], p, s)); W[6] = s < 1 && !st.tie ? wp.h : W[6];
  // ring side: hangs to the pull ring
  const hr = 66 - ckHw(st)(i), pileR = [Hr, [ckWX, yr + .4, 57], [ckWX, yr + .6, 53], [ckWX, yr + .7, 49.5]];
  let R = ckLin(Hr, [ckWX, yr, hr], 4).map((p, k) => ckLerp3(pileR[k], p, s));
  if (tc > 0){
    const tw = [Hw, ckLerp3(Hw, ckBundle, .55), ckBundle, [ckWX, 20 + (yw - 20)*.18, 47], [ckWX, 20 + (yw - 20)*.22, 43.5], [ckWX + .2, 20 + (yw - 20)*.25, 40.5], [ckWX + .3, 20 + (yw - 20)*.28, 38]];
    W = W.map((p, k) => ckLerp3(p, tw[k], tc));
    const tr = [Hr, ckBundle, [ckWX, 20 + (yr - 20)*.2, 46], [ckWX + .2, 20 + (yr - 20)*.26, 42]];
    R = R.map((p, k) => ckLerp3(p, tr[k], tc));
  }
  return { W, R, ring: R[R.length - 1] };
}
const ckPhi = st => st.phi;
const ckBob = st => [ckPV[0], ckPV[1] + ckPL*Math.sin(st.phi), ckPV[2] - ckPL*Math.cos(st.phi)];

/* ---------- the scene ---------- */
const ckFRONT = [[ckY0,ckZ0],[ckY1,ckZ0],[ckY1,ckZ1],[ckYC,96.6],[ckY0,ckZ1]];
function ckScene(st){
  const BT = boardTop(0, 0, 27, 40, 2.5, 3);
  let s = board(0, 0, 27, 40, 2.5, 3, ckFLOOR);
  // shadows on the floor: the wall, the weights lying down, the ribbon spool
  const lying = [0,1,2].map(i => ckWeightPose(st, i)).filter(p => p.h[2] < 10);
  let sh = castShadow([[0,0,2.5],[2.5,0,2.5],[2.5,40,2.5],[0,40,2.5],[0,0,30],[2.5,0,30],[2.5,40,30],[0,40,30]], 2.5, BT);
  for (const p of lying){ const c = ckCone(p.h, p.ax); sh += castShadow(c.pts, 2.5, BT); }
  sh += castShadow([...on(PZ(2.5), ellUV(ckSpool[0], ckSpool[1], 2.3, 2.3, 12)), ...on(PZ(6), ellUV(ckSpool[0], ckSpool[1], 2.3, 2.3, 12))], 2.5, BT);
  s += sh;

  // the wall: a papered panel standing on the floor
  s += box(0, 0, 2.5, ckXB, 40, 106, ckWALL, toneI, 1.1);
  let stripes = ''; for (let y = 2; y < 40; y += 4) stripes += pd(on(PX(ckXB + .02), rectUV(y, 2.6, y + 2, 105.8)));
  s += `<path d="${stripes}" fill="#f2d2d9" opacity=".7"/>`;
  s += ink(pd(on(PX(ckXB + .03), [[0, 100],[40, 100]]), false), .7) + `<path d="${pd(on(PX(ckXB + .04), [[0, 99.4],[40, 99.4]]), false)}" stroke="${ckBRASS.m}" stroke-width="1.4" fill="none"/>`;
  s += hullInk([[0,0,2.5],[ckXB,0,2.5],[ckXB,40,2.5],[0,40,2.5],[0,0,106],[ckXB,0,106],[ckXB,40,106],[0,40,106]], 2.2);
  // the clock's soft shadow on the wallpaper (falls down and to the left)
  const wsh = p => [ckXB + .05, p[1] + (p[0] - ckXB)*.5, p[2] - (p[0] - ckXB)*.45];
  const caseOut = [[ckXF,ckY0,ckZ0],[ckXF,ckY1,ckZ0],[ckXF,ckY1,ckZ1],[18.5,33,86],[18.5,ckYC,98.4],[18.5,7,86],[ckXF,ckY0,ckZ1]];
  s += clipTo(on(PX(ckXB + .05), rectUV(0, 2.5, 40, 106)), fill(sp(hull(caseOut.map(wsh).map(p => P(...p)))), SHADOW, 'opacity=".28"'));

  // the pendulum, behind the chains
  const bob = ckBob(st), ph = st.phi;
  let pend = rod([ckPV[0], ckPV[1], ckZ0], bob, .28, ckBRASS, toneI, .9);
  const lpts = ckLEAF.map(([a, b]) => [bob[1] + 4.2*(a*Math.cos(ph) - b*Math.sin(ph)), bob[2] + 4.2*(a*Math.sin(ph) + b*Math.cos(ph)) - 1]);
  pend += shape(on(PX(ckPV[0] + .3), lpts), ckCARVE.l, 1.3) + ink(pd(on(PX(ckPV[0] + .35), [[bob[1], bob[2] + 2.6],[bob[1] - 4.4*Math.sin(ph), bob[2] - 4.4*Math.cos(ph) - .6]]), false), .7);
  s += pend;

  // chains, rings and weights, back to front
  const parts = [];
  for (let i = 0; i < 3; i++){
    const S = ckStrands(st, i), wp = ckWeightPose(st, i), cone = ckCone(wp.h, wp.ax);
    parts.push({ at: [ckWX - .1, ckTY[i], 30], svg: ckChain(S.W) + ckChain(S.R) + (S.ring[2] > 5 ? ckRing(PX(ckWX), S.ring[1], S.ring[2] - 1.5, 1.5) : ckRing(PZ(2.7), S.ring[0], S.ring[1], 1.5)) });
    parts.push({ at: wp.h[2] < 10 ? [wp.h[0] + 6, wp.h[1], 4] : [ckWX + .2, ckTY[i] - 2.2, wp.h[2] - 6], svg: cone.svg });
  }
  // the ribbon spool on the floor (where the tie comes from)
  parts.push({ at: [ckSpool[0], ckSpool[1], 4], svg: cyl(ckSpool[0], ckSpool[1], 2.5, 6, 2.3, ckRIBBON, toneI, 1.2, 18) + `<path d="${pd(on(PZ(6.05), ellUV(ckSpool[0], ckSpool[1], .7, .7, 10)))}" fill="${ckBRASS.m}"/>` });
  s += byDepth(parts);

  // the ribbon on its way, then the bow round the bundle
  if (st.tie > .5){
    const k = ckClamp((st.tie - .5) / .3), from = [ckSpool[0], ckSpool[1], 6], to = [ckBundle[0] + .4, ckBundle[1], ckBundle[2]];
    const mid = [ckLerp(from[0], to[0], .5) + 3, ckLerp(from[1], to[1], .5), 40];
    if (k < 1){ const q = ckSmooth([from, mid, to]); const n = Math.max(2, Math.round(q.length * k)); s += `<path d="${pd(q.slice(0, n), false)}" fill="none" stroke="${ckRIBBON.m}" stroke-width="1.6" stroke-linecap="round"/>`; }
    if (st.tie > .78){
      const b = ckBundle, pl = PX(b[0] + .5), o = ckClamp((st.tie - .78) / .2);
      let bow = shape(on(pl, rectUV(b[1] - 3.2, b[2] - .9, b[1] + 3.2, b[2] + .9)), ckRIBBON.l, 1);
      bow += shape(on(PX(b[0] + .7), [[b[1], b[2]],[b[1] + 3.2*o, b[2] + 2.2*o],[b[1] + 3.6*o, b[2] - .2],[b[1], b[2] - .3]]), ckRIBBON.l, 1);
      bow += shape(on(PX(b[0] + .7), [[b[1], b[2]],[b[1] - 3.2*o, b[2] + 2.2*o],[b[1] - 3.6*o, b[2] - .2],[b[1], b[2] - .3]]), ckRIBBON.l, 1);
      bow += shape(on(PX(b[0] + .75), [[b[1] - .3, b[2] - .2],[b[1] - 1.6*o, b[2] - 4.2*o],[b[1] - .6, b[2] - 3.4*o]]), ckRIBBON.m, .8);
      bow += shape(on(PX(b[0] + .75), [[b[1] + .3, b[2] - .2],[b[1] + 1.8*o, b[2] - 3.8*o],[b[1] + .8, b[2] - 3.2*o]]), ckRIBBON.m, .8);
      bow += shape(on(PX(b[0] + .8), ellUV(b[1], b[2], .9, .8, 10)), ckRIBBON.m, .9);
      s += bow;
    }
  }

  /* ----- the case ----- */
  const see = st.see > 0;
  // inside, seen through the front: back of the case, the brass movement, the three chain wheels and their chains
  if (see){
    let inside = fill(pd(on(PX(ckXF), ckFRONT)), '#3d2717');
    inside += shape(on(PX(12.5), rrUV(11.5, 61.5, 28.5, 80.5, 1.2)), ckBRASS.m, 1.1);
    for (const [y, z] of [[13, 63.5],[27, 63.5],[13, 78.5],[27, 78.5]]) inside += fill(pd(on(PX(12.55), ellUV(y, z, .55, .55, 8))), ckBRASS.d);
    const ga = st.gearA;
    inside += ckGear(12.6, 20, 72.5, 3.6, 22, ga, ckBRASS) + ckGear(12.6, 15.2, 76.2, 2.1, 12, -ga * 1.7, ckBRASS) + ckGear(12.6, 24.2, 77.6, 1.9, 15, ga * 3, ckBRASS);
    inside += shape(on(PX(13.5), [[22.6, 80.4],[25.8, 80.4],[26.2, 79.2],[24.2, 79.9],[22.2, 79.2]]), '#9aa3a6', .8);   // the anchor
    for (let i = 0; i < 3; i++){
      const y = ckTY[i], s0 = ease(st.seat[i]);
      inside += ckSprocket(y, st.wheelA[i]);
      // seated: up one side, over the spikes, down the other; slipped: a slack loop hanging beside the wheel
      const seated = [[ckWX, y - 2.2, ckZ0],[ckWX, y - 2.3, 63.5],[ckWX, y - 2.2, ckWZ],[ckWX, y - 1.6, ckWZ + 1.6],[ckWX, y, ckWZ + 2.3],[ckWX, y + 1.6, ckWZ + 1.6],[ckWX, y + 2.2, ckWZ],[ckWX, y + 2.3, 63.5],[ckWX, y + 2.2, ckZ0]];
      const slack = [[ckWX, y - 2.2, ckZ0],[ckWX, y - 2.8, 61.6],[ckWX, y - 2.9, 62.6],[ckWX, y - 2.3, 63.1],[ckWX, y - 1.2, 63.0],[ckWX, y, 62.4],[ckWX, y + 1.2, 61.6],[ckWX, y + 2, 60.9],[ckWX, y + 2.2, ckZ0]];
      inside += ckChain(slack.map((p, k) => ckLerp3(p, seated[k], s0)));
    }
    s += clipTo(on(PX(ckXF), ckFRONT), inside);
  }
  // front face, see-through when looking inside
  s += `<g opacity="${see ? .22 : 1}">` + fill(pd(on(PX(ckXF), ckFRONT)), tone([1,0,0], ckCASE)) + `</g>`;
  s += ink(pd(on(PX(ckXF), ckFRONT)), 2);
  // the left side
  s += shape([[ckXB,ckY1,ckZ0],[ckXF,ckY1,ckZ0],[ckXF,ckY1,ckZ1],[ckXB,ckY1,ckZ1]], tone([0,1,0], ckCASE), 1.2);
  // carved leaves and a vine across the front
  const FP = PX(ckXF + .12);
  let carve = '';
  for (const [u, v, sc, r] of [[11.9, 83.6, 2.7, -.5],[28.1, 83.6, 2.7, .5],[11.8, 62.9, 2.9, 2.6],[28.2, 62.9, 2.9, -2.6],[14.2, 89.4, 2.1, -.3],[25.8, 89.4, 2.1, .3],[20, 91.2, 1.9, 0]])
    carve += ckLeaf(FP, u, v, sc, r);
  carve += `<path d="${pd(on(PX(ckXF + .1), [[10.5,87.4],[14,88.4],[17,87.9],[20,88.6],[23,87.9],[26,88.4],[29.5,87.4]]), false)}" fill="none" stroke="${ckCARVE.d}" stroke-width="1.2" stroke-linecap="round"/>`;
  s += see ? `<g opacity=".35">${carve}</g>` : carve;

  // the dial
  const [dy, dz, dr] = ckDial, DP = PX(ckXF + .2);
  let dial = shape(on(DP, ellUV(dy, dz, dr + 1.1, dr + 1.1, 36)), ckCARVE.l, 1.2) + shape(on(PX(ckXF + .3), ellUV(dy, dz, dr, dr, 36)), see ? 'rgba(251,250,243,.35)' : '#fbf6ea', 1.1);
  let ticks = ''; for (let k = 0; k < 12; k++){ if (k % 3 === 0) continue; const a = k/12*2*Math.PI; ticks += pd(on(PX(ckXF + .35), [[dy - (dr-.7)*Math.sin(a), dz + (dr-.7)*Math.cos(a)],[dy - (dr-1.6)*Math.sin(a), dz + (dr-1.6)*Math.cos(a)]]), false); }
  dial += `<path d="${ticks}" fill="none" stroke="${INK}" stroke-width=".9" stroke-linecap="round"/>`;
  for (const [k, t] of [[0,'XII'],[3,'III'],[6,'VI'],[9,'IX']]){ const a = k/12*2*Math.PI; dial += tx(ckXF + .4, dy - (dr - 1.9)*Math.sin(a), dz + (dr - 1.9)*Math.cos(a) - .75, t, 2, INK, 700); }
  const hand = (ang, len, wd) => { const sa = Math.sin(ang), ca = Math.cos(ang), pt = (a, b) => [dy - a*sa + b*ca*-1 * 0 - b*ca, dz + a*ca - b*sa];
    const P2 = (a, b) => [dy - a*sa - b*ca, dz + a*ca - b*sa];
    return shape(on(PX(ckXF + .55), [P2(-1, -wd*.5), P2(len*.62, -wd*.5), P2(len*.7, -wd*1.4), P2(len, 0), P2(len*.7, wd*1.4), P2(len*.62, wd*.5), P2(-1, wd*.5)]), '#2b2018', .6); };
  const mn = st.min % 60, hr = (st.min / 60) % 12;
  dial += hand(hr/12*2*Math.PI, 3.6, .8) + hand(mn/60*2*Math.PI, 5.3, .6) + fill(pd(on(PX(ckXF + .6), ellUV(dy, dz, .6, .6, 10))), '#2b2018');
  s += dial;

  // the cuckoo's door and the bird
  const [d0, d1, dz0, dz1] = ckDoor, cw = d1 - d0, q = st.pop, th = ckClamp(q * 2.2) * 105 * Math.PI/180;
  s += shape(on(PX(ckXF + .15), rectUV(d0 - .6, dz0 - .6, d1 + .6, dz1 + .6)), ckCARVE.m, 1);
  if (th > .01){
    s += fill(pd(on(PX(ckXF + .2), rectUV(d0, dz0, d1, dz1))), '#1d130b');
    const out = ckClamp(q * 1.6 - .3) * 4.2, bx = ckXF - .6 + out, by = (d0 + d1)/2, bz = 82.4;
    if (out > .2){
      let bird = rod([ckXF - .5, by, bz - 1.6], [bx, by, bz - 1.6], .25, ckBRASS, toneI, .7);
      bird += shape(on(PX(bx), ellUV(by, bz, 1.9, 1.5, 18)), '#5f739b', 1.1) + shape(on(PX(bx + .05), ellUV(by, bz - .5, 1.1, .8, 14)), '#f3e7d2', .7);
      bird += shape(on(PX(bx + .1), ellUV(by, bz + 1.7, 1.1, 1.05, 16)), '#5f739b', 1.1);
      bird += fill(pd(on(PX(bx + .15), ellUV(by - .45, bz + 1.95, .22, .22, 6))), INK) + fill(pd(on(PX(bx + .15), ellUV(by + .45, bz + 1.95, .22, .22, 6))), INK);
      bird += shape(on(PX(bx + .2), [[by - .45, bz + 1.45],[by + .45, bz + 1.45],[by, bz + .55 - (st.beak ? .5 : 0)]]), '#f0a23b', .6);
      bird += shape(on(PX(bx + .05), [[by - 1.9, bz + .2],[by - 3.1, bz - 1.2],[by - 1.4, bz - .9]]), '#4a5c82', .7) + shape(on(PX(bx + .05), [[by + 1.9, bz + .2],[by + 3.1, bz - 1.2],[by + 1.4, bz - .9]]), '#4a5c82', .7);
      s += bird;
    }
    if (st.beak) s += tx(ckXF + 1, 31, 101, 'CUCKOO', 2.8, ckRIBBON.d, 800);
  }
  // the door, hinged on its viewer-right edge
  const dpt = (u, z) => [ckXF + .2 + u*Math.sin(th), d0 + u*Math.cos(th), z];
  s += act('door', shape([dpt(0, dz0), dpt(cw, dz0), dpt(cw, dz1), dpt(0, dz1)], th > 1.2 ? ckCASE.m : ckCASE.l, 1.1)
    + (th < 1.2 ? fill(pd(on(PX(ckXF + .3), ellUV(d1 - .9, (dz0 + dz1)/2, .35, .35, 8))), ckBRASS.d) : ''));

  // the roof: two slabs meeting at the ridge, a scalloped trim under the front edge, a carved bird on top
  const RX0 = 2, RX1 = 18.6, E = 86.2, RZ = 98.4, TH = 1.4;
  s += shape([[RX0,7,E],[RX1,7,E],[RX1,ckYC,RZ],[RX0,ckYC,RZ]], toneI([0,-1,1.1], ckROOF), 1.1);
  s += shape([[RX1,7,E],[RX1,ckYC,RZ],[RX1,ckYC,RZ - TH],[RX1,7,E - TH]], ckROOF.m, 1);
  s += shape([[RX0,ckYC,RZ],[RX1,ckYC,RZ],[RX1,33,E],[RX0,33,E]], toneI([0,1,1.1], ckROOF), 1.1);
  s += shape([[RX1,ckYC,RZ],[RX1,33,E],[RX1,33,E - TH],[RX1,ckYC,RZ - TH]], ckROOF.m, 1);
  s += shape([[RX0,33,E],[RX1,33,E],[RX1,33,E - TH],[RX0,33,E - TH]], ckROOF.d, 1);
  let shingle = '';
  for (const k of [.22, .44, .66, .88]){ shingle += pd([[RX0 + .5, ckLerp(ckYC, 33, k), ckLerp(RZ, E, k)],[RX1 - .3, ckLerp(ckYC, 33, k), ckLerp(RZ, E, k)]], false);
    shingle += pd([[RX0 + .5, ckLerp(ckYC, 7, k), ckLerp(RZ, E, k)],[RX1 - .3, ckLerp(ckYC, 7, k), ckLerp(RZ, E, k)]], false); }
  s += `<path d="${shingle}" fill="none" stroke="${INK}" stroke-width=".7" opacity=".7"/>`;
  let trim = '';
  for (let k = 0; k < 6; k++){ const t0 = k/6, t1 = (k+1)/6;
    for (const sideY of [7, 33]){ const a = [RX1 - .1, ckLerp(sideY, ckYC, t0), ckLerp(E, RZ, t0) - TH], b = [RX1 - .1, ckLerp(sideY, ckYC, t1), ckLerp(E, RZ, t1) - TH];
      const m = [RX1 - .1, (a[1] + b[1])/2, (a[2] + b[2])/2 - 1.3]; trim += pd([a, m, b], false); } }
  s += `<path d="${trim}" fill="${ckCARVE.l}" stroke="${INK}" stroke-width=".8" stroke-linejoin="round"/>`;
  const fb = PX(RX1 + .1);
  s += shape(on(fb, [[ckYC - 1.6, RZ - .2],[ckYC + 1.8, RZ - .2],[ckYC + 2.6, RZ + 1.2],[ckYC + 1, RZ + 2.4],[ckYC + .2, RZ + 3.6],[ckYC - .9, RZ + 3.1],[ckYC - 2.6, RZ + 2.2],[ckYC - 3.4, RZ + 2.8],[ckYC - 2.4, RZ + 1]]), ckCARVE.l, 1);
  s += fill(pd(on(PX(RX1 + .15), ellUV(ckYC - .1, RZ + 2.8, .25, .25, 6))), INK);

  // silhouette of the clock (case + roof); the chains and weights carry their own ink
  s += hullInk([[ckXB,ckY0,ckZ0],[ckXF,ckY0,ckZ0],[ckXB,ckY1,ckZ0],[ckXF,ckY1,ckZ0],[ckXB,ckY1,ckZ1],[ckXF,ckY0,ckZ1],[ckXF,ckY1,ckZ1]], 2.4);
  s += hullInk([[RX0,7,E - TH],[RX1,7,E - TH],[RX0,33,E - TH],[RX1,33,E - TH],[RX0,7,E],[RX1,7,E],[RX0,33,E],[RX1,33,E],[RX0,ckYC,RZ],[RX1,ckYC,RZ]], 2.2);

  // labels
  const w0 = ckWeightPose(st, 0), c0 = ckCone(w0.h, w0.ax);
  if (see) s += tag([ckWX, ckTY[0] - 1.6, ckWZ + 1.6], 92, 6, 'CHAIN WHEEL', st.act && (st.act.kind === 'feed' || st.act.kind === 'wind'));
  s += tag(c0.mid, 70, 6, 'WEIGHT', st.run || (st.act && st.act.kind === 'wind'));
  s += tag([ckPV[0], bob[1], bob[2] - 1], -78, 26, 'PENDULUM', st.run);
  s += tag([ckXF + .3, ckDoor[0] + .6, ckDoor[3] - .4], 72, -40, 'CUCKOO DOOR', st.pop > 0);
  if (st.tie > .9) s += tag([ckBundle[0] + .8, ckBundle[1] + 2.4, ckBundle[2] + .6], -80, -14, 'TIED', true);
  return s;
}

/* ---------- behaviour ---------- */
let ckUI;
const ckFmt = m => { const h = Math.floor(m / 60) % 12 || 12, mm = Math.floor(m % 60); return h + ':' + String(mm).padStart(2, '0'); };
const ckAllOn = st => st.seat.every(v => v >= 1);
function ckLoop(){
  const st = ckUI.st; if (st.loop) return; st.loop = true;
  let last = performance.now();
  ckUI.animate(() => {
    const now = performance.now(), dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
    const A = st.act;
    if (A){ A.t += dt;
      if (A.kind === 'feed'){ for (let i = 0; i < 3; i++){ const v = ckClamp((A.t - i*.75) / 1.3); st.seat[i] = Math.max(st.seat[i], v); st.wheelA[i] = -v * 1.2; } if (A.t > 2.9){ st.act = null; ckUI.flash('all three chains are back on their wheels'); } }
      else if (A.kind === 'wind'){ const k = ease(ckClamp(A.t / 1.8)); for (let i = 0; i < 3; i++){ st.w[i] = ckLerp(A.w0[i], 1, k); st.wheelA[i] = A.a0[i] - k * 6; } st.gearA -= dt * .2; if (A.t >= 1.8){ st.act = null; ckUI.flash('wound: the weights are up'); } }
      else if (A.kind === 'tie'){ st.tie = ckClamp(A.t / 3.4); if (A.t >= 3.4){ st.act = null; ckUI.flash('chains tied, weights off: ready for the trip'); } }
      else if (A.kind === 'reset'){ const k = ease(ckClamp(A.t / 1.4)); for (let i = 0; i < 3; i++){ st.seat[i] = A.s0[i] * (1 - k); st.w[i] = A.w0[i] * (1 - k); } st.tie = A.t0 * (1 - k); if (A.t >= 1.4){ st.act = null; } }
    }
    if (st.run){
      st.amp = Math.min(.24, st.amp + dt * .25); st.ptime += dt;
      const before = st.min; st.min += dt * 2.2; st.gearA -= dt * 1.4; st.wheelA[0] += dt * .25;
      st.w[0] = Math.max(0, st.w[0] - dt * .006);
      if (Math.floor(st.min / 60) > Math.floor(before / 60)){ const h = Math.floor(st.min / 60) % 12 || 12; st.calls += Math.min(h, 3); }
      if (st.w[0] <= 0){ st.run = false; ckUI.flash('the time weight has run down: pull the rings to wind'); }
    } else st.amp = Math.max(0, st.amp - dt * .35);
    st.phi = st.amp * Math.sin(st.ptime * 2 * Math.PI / 1.15);
    if (!st.run && st.amp <= 0) st.ptime = 0;
    // the cuckoo: one call at a time
    if (st.calls > 0 || st.callT > 0){
      if (st.callT <= 0 && st.calls > 0){ st.calls--; st.callT = 1.25; st.w[1] = Math.max(0, st.w[1] - .04); st.w[2] = Math.max(0, st.w[2] - .02); st.wheelA[1] += .6; st.wheelA[2] += .3; }
      st.callT -= dt; const t = 1.25 - st.callT;
      st.pop = t < .35 ? ease(t / .35) : t < .85 ? 1 : ease(ckClamp((1.25 - t) / .4));
      st.beak = t > .4 && t < .8;
      if (st.callT <= 0){ st.pop = 0; st.beak = false; st.callT = 0; }
    }
    const busy = st.act || st.run || st.amp > 0 || st.calls > 0 || st.callT > 0;
    if (!busy) st.loop = false;
    return !!busy;
  });
}
const ckBusy = (st, ui) => { if (st.act){ ui.flash('one moment'); return true; } return false; };
function ckFeed(st, ui){
  if (ckBusy(st, ui)) return;
  if (st.tie > 0) return ui.flash('it is tied for the trip: start over to hang it again');
  if (ckAllOn(st)) return ui.flash('the chains are already on their wheels');
  st.act = { kind:'feed', t:0 }; ckLoop();
}
function ckWind(st, ui){
  if (ckBusy(st, ui)) return;
  if (st.tie > 0) return ui.flash('the weights are off for the trip');
  if (!ckAllOn(st)) return ui.flash('the chains are off their wheels: feed them back on first');
  if (st.w.every(v => v > .98)) return ui.flash('already fully wound');
  st.act = { kind:'wind', t:0, w0: st.w.slice(), a0: st.wheelA.slice() }; ckLoop();
}
function ckSwing(st, ui){
  if (ckBusy(st, ui)) return;
  if (st.tie > 0) return ui.flash('it is packed for the trip');
  if (!ckAllOn(st)) return ui.flash('it cannot run with the chains off');
  if (st.run){ st.run = false; return ui.flash('pendulum stopped'); }
  if (st.w[0] < .03) return ui.flash('the weights are down: pull the rings to wind first');
  st.run = true; ckLoop();
}
function ckTie(st, ui){
  if (ckBusy(st, ui)) return;
  if (st.tie >= 1) return ui.flash('already tied');
  if (!ckAllOn(st)) return ui.flash('feed the chains back on first, or they tangle on the way');
  st.run = false; st.act = { kind:'tie', t:0 }; ckLoop();
}
function ckReset(st, ui){
  if (st.act) return;
  st.run = false; st.calls = 0;
  st.act = { kind:'reset', t:0, s0: st.seat.slice(), w0: st.w.slice(), t0: st.tie }; ckLoop();
}

ckUI = mountFigure({
  fig:'03', title:'The cuckoo clock', hint:'it came in with its chains off its wheels',
  size:[27, 40, 106], palette:'blush', credit: true,
  state:{ seat:[0,0,0], w:[0,0,0], tie:0, see:0, run:false, amp:0, phi:0, ptime:0, min:118, gearA:0, wheelA:[0,0,0], pop:0, beak:false, calls:0, callT:0, act:null, loop:false },
  scene: st => ckScene(st),
  stats: st => [{ label:'Time', value: ckFmt(st.min) }, { label:'Chains on', value: st.seat.filter(v => v >= 1).length + ' of 3', small:true }],
  buttonsLabel:'Repair it',
  buttons:[
    { label:'Look inside', onClick:(st, ui) => { st.see = st.see ? 0 : 1; } },
    { label:'Feed the chains on', onClick: ckFeed },
    { label:'Pull the rings to wind', onClick: ckWind },
    { label:'Swing the pendulum', onClick: ckSwing },
    { label:'Tie it for the trip', onClick: ckTie },
    { label:'Start over', onClick: ckReset },
  ],
  acts:{ door:(st, el, ui) => { if (ckAllOn(st) && !st.tie && st.w[1] > .02){ st.calls = Math.max(st.calls, 1); ckLoop(); } else ui.flash(st.tie ? 'packed for the trip' : 'the cuckoo needs the chains on and wound'); } },
  params:(st, q) => {
    const s = q.get('state');
    if (s === 'fed' || s === 'wound' || s === 'run' || s === 'tied'){ st.seat = [1,1,1]; }
    if (s === 'wound' || s === 'run' || s === 'tied') st.w = [1,1,1];
    if (s === 'run'){ st.run = true; st.amp = .24; st.ptime = .3; st.phi = .2; }
    if (s === 'tied') st.tie = 1;
    if (q.has('see')) st.see = +q.get('see');
    if (q.has('pop')){ st.pop = +q.get('pop'); st.beak = st.pop > .9; }
    if (q.has('seat')) st.seat = [0,1,2].map(() => +q.get('seat'));
    if (q.has('tie')){ st.seat = [1,1,1]; st.w = [1,1,1]; st.tie = +q.get('tie'); }
    if (q.has('min')) st.min = +q.get('min');
  },
});
if (ckUI.st.run) ckLoop();
</script>
